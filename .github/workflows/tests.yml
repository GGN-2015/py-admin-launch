name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  current-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Exercise CLI
        run: |
          py-admin-launch --help
          py-sudo --help

  python36-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.6"
          architecture: x64
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Exercise CLI
        run: |
          py-admin-launch --help
          py-sudo --help

  python36-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Test in official Python 3.6 container
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          python:3.6
          bash -c "python -m pip install . && python -m unittest discover -s tests && py-admin-launch --help"
